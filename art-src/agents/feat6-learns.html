<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_kit.css"><style>
  /* Feature 6 · "The more it works, the more it knows" — Ona memory panel:
     accumulated business rules the agent picked up on the job, capped with
     who's behind them. Portrait card commands the well; the four learned
     rules are the payoff — specific enough to be non-generic. */
  .mem{width:640px}
  .spec__m{font-size:19px;color:var(--sub)}
  .mem .row{padding:26px 30px;gap:20px}
  .ic{width:42px;height:42px;border-radius:12px;background:var(--maroon-tint);color:var(--maroon);
      display:flex;align-items:center;justify-content:center;flex:none}
  .ic svg{width:21px;height:21px}
  .col{flex:1;min-width:0}
  .foot{display:flex;align-items:center;gap:16px;padding:24px 30px;border-top:1px solid var(--line)}
  .foot__t{font-size:18px;color:var(--sub)} .foot__t b{color:var(--ink);font-weight:480}
</style></head><body><div class="stage cv-warm">
  <div class="card mem">
    <div class="hd">
      <span class="tile tile--maroon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4a3 3 0 0 0-3 3v1a3 3 0 0 0-2 5 3 3 0 0 0 2 5h1a3 3 0 0 0 3 3V4z"/><path d="M15 4a3 3 0 0 1 3 3v1a3 3 0 0 1 2 5 3 3 0 0 1-2 5h-1a3 3 0 0 1-3 3V4z"/></svg></span>
      <div><div class="hd__t">Memory</div><div class="spec__m" style="margin-top:2px;color:var(--ok);font-weight:480">↑ +4 today</div></div>
      <span class="tag tag--ok sp">128 notes</span>
    </div>
    <div class="rows">
      <div class="row">
        <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h9l5 5v13a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"/><path d="M14 3v5h5"/></svg></span>
        <div class="col"><div class="row__l">Acme pays net-60</div><div class="row__s">confirmed across 3 invoices</div></div>
      </div>
      <div class="row">
        <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h9l5 5v13a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"/><path d="M14 3v5h5"/></svg></span>
        <div class="col"><div class="row__l">Q3 close excludes intercompany</div><div class="row__s">from the close playbook</div></div>
      </div>
      <div class="row">
        <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h9l5 5v13a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"/><path d="M14 3v5h5"/></svg></span>
        <div class="col"><div class="row__l">&gt;$10k needs Priya</div><div class="row__s">approval policy, learned once</div></div>
      </div>
      <div class="row">
        <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h9l5 5v13a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"/><path d="M14 3v5h5"/></svg></span>
        <div class="col"><div class="row__l">EU invoices need VAT id</div><div class="row__s">compliance rule</div></div>
      </div>
    </div>
    <div class="foot">
      <span class="av" style="width:40px;height:40px"><img src="https://api.dicebear.com/9.x/adventurer/svg?seed=Ledger&backgroundColor=c5f2e0" alt=""></span>
      <div class="foot__t"><b>Ledger</b> learned this across 1,204 tasks</div>
    </div>
  </div>
</div></body></html>
