<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_kit.css"><style>
  /* Feature 7 · "Feed it your files and skills" — Ona agent-drive panel:
     the source files the agent reads plus the reusable skills built on top.
     Portrait card commands the well; real filenames are the payoff. */
  .drv{width:640px}
  .spec__m{font-size:19px;color:var(--sub)}
  .drv .row{padding:26px 30px;gap:20px}
  .ic{width:42px;height:42px;border-radius:12px;background:var(--maroon-tint);color:var(--maroon);
      display:flex;align-items:center;justify-content:center;flex:none}
  .ic svg{width:21px;height:21px}
  .fname{flex:1;font-family:var(--mono);font-size:20px;font-weight:480;color:var(--ink)}
  .fsize{flex:none;font-family:var(--mono);font-size:16px;color:var(--soft)}
  .skills{padding:24px 30px 30px;border-top:1px solid var(--line)}
  .skills__lb{font-size:15px;color:var(--soft);text-transform:uppercase;letter-spacing:.07em;font-weight:480;margin-bottom:16px}
  .skills__row{display:flex;flex-wrap:wrap;gap:12px}
  .chip svg{width:17px;height:17px;color:var(--maroon)}
</style></head><body><div class="stage cv-cream">
  <div class="card drv">
    <div class="hd">
      <span class="tile tile--maroon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7a2 2 0 0 1 2-2h4l2 2h6a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H4z"/></svg></span>
      <div><div class="hd__t">Agent drive</div><div class="spec__m" style="margin-top:2px">4 files · 3 skills</div></div>
      <span class="tag tag--ok sp"><span class="pip"></span>Synced</span>
    </div>
    <div class="rows">
      <div class="row">
        <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h9l5 5v13a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"/><path d="M14 3v5h5"/><path d="M8 13h8M8 17h5"/></svg></span>
        <div class="fname">close-playbook.md</div>
        <div class="fsize">24 KB</div>
      </div>
      <div class="row">
        <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h9l5 5v13a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"/><path d="M14 3v5h5"/></svg></span>
        <div class="fname">brand-guide.pdf</div>
        <div class="fsize">3.1 MB</div>
      </div>
      <div class="row">
        <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M9 4v16M15 4v16"/></svg></span>
        <div class="fname">vendor-list.csv</div>
        <div class="fsize">61 KB</div>
      </div>
      <div class="row">
        <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M9 4v16M15 4v16"/></svg></span>
        <div class="fname">pricing.xlsx</div>
        <div class="fsize">140 KB</div>
      </div>
    </div>
    <div class="skills">
      <div class="skills__lb">Skills</div>
      <div class="skills__row">
        <span class="chip"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>Month-end close</span>

        <span class="chip"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>Reconcile</span>
      </div>
    </div>
  </div>
</div></body></html>
