<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="_kit.css"></head><body>
<!-- Same chrome+pane pattern as the computer card. File rows are mono with a
     right-aligned size lane; skills use Ona's exact chip treatment. -->
<div class="stage cv-cream">
  <div class="card card--chrome">
    <div class="hd">
      <span class="hd__g"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7.5A1.5 1.5 0 0 1 4.5 6h4.2l2 2.6h8.8A1.5 1.5 0 0 1 21 10.1v8.4a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 18.5z"/></svg></span>
      <span><span class="hd__t">Agent drive</span></span>
      <span class="hd__r"><span class="pill"><span class="pill__dot"></span>Synced</span></span>
    </div>
    <div class="pane" style="padding:8px 24px 24px">
      <div class="list">
        <div class="row" style="height:80px;padding:0"><span class="mk"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M8 13h8M8 17h5"/></svg></span>
          <span class="row__b"><div class="row__t row__t--mono">close-playbook.md</div></span><span class="row__v">24 KB</span></div>
        <div class="row" style="height:80px;padding:0"><span class="mk"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M8 13h8M8 17h5"/></svg></span>
          <span class="row__b"><div class="row__t row__t--mono">vendor-terms.pdf</div></span><span class="row__v">1.4 MB</span></div>
        <div class="row" style="height:80px;padding:0"><span class="mk"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="3.5" width="17" height="17" rx="2"/><path d="M3.5 9h17M9 9v11.5"/></svg></span>
          <span class="row__b"><div class="row__t row__t--mono">chart-of-accounts.csv</div></span><span class="row__v">61 KB</span></div>
        <div class="row" style="height:80px;padding:0;border-bottom:0"><span class="mk"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="3.5" width="17" height="17" rx="2"/><path d="M3.5 9h17M9 9v11.5"/></svg></span>
          <span class="row__b"><div class="row__t row__t--mono">pricing-2026.xlsx</div></span><span class="row__v">140 KB</span></div>
      </div>
      <div class="sep"></div>
      <div class="lbl" style="margin-bottom:14px">Reusable skills</div>
      <div class="chips">
        <span class="chip chip--mono">Month-end close</span>
        <span class="chip chip--mono">Draft board pack</span>
        <span class="chip chip--mono">Reconcile</span>
      </div>
    </div>
  </div>
</div></body></html>
