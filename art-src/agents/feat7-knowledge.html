<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="_kit.css"></head><body>
<!-- Krishna correction: a DRIVE (storage), not an IDE. RULE 1: header carries a
     bare disk glyph, never reused as a row mark. RULE 2: the files column is
     bare stroked glyphs throughout; the skills block is its own sub-block with
     a bare spark glyph. RULE 7: one maroon accent — the button-card only. -->
<style>
  .card { width: 680px; }
  .file-row { height: 80px; padding: 0; }
  .skill-row { display: flex; gap: 14px; }
  .skill-card {
    flex: 1; background: var(--panel); border: 1px solid var(--hair);
    border-radius: 14px; padding: 16px 18px; display: flex; flex-direction: column; gap: 8px;
  }
  .skill-card__g { width: 24px; height: 24px; color: var(--sub); }
  .skill-card__g svg { width: 100%; height: 100%; display: block; }
  .skill-card__name { font-size: 21px; font-weight: 450; letter-spacing: -.006em; color: var(--ink); }
  .skill-card__meta { font-size: 16px; color: var(--soft); font-family: var(--mono); }
  .btn-card {
    margin-top: 18px; display: flex; align-items: center; justify-content: center; gap: 10px;
    background: var(--maroon-deep); color: #fff; border-radius: 12px; padding: 18px 20px;
    font-size: 21px; font-weight: 480;
    box-shadow: 0 14px 30px -14px rgba(93, 55, 75, .55);
  }
</style>
<div class="stage cv-cream">
  <div class="card card--chrome">
    <div class="hd">
      <span class="hd__g"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v6c0 1.66 3.58 3 8 3s8-1.34 8-3V5"/><path d="M4 11v6c0 1.66 3.58 3 8 3s8-1.34 8-3v-6"/></svg></span>
      <span class="hd__t">Agent drive</span>
      <span class="hd__r"><span class="pill pill--mono">12 GB</span></span>
    </div>
    <div class="pane" style="padding:8px 24px 24px">
      <div class="list">
        <div class="row file-row">
          <span class="mk"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 6.5A1.5 1.5 0 0 1 5 5h4.5l2 2.5H19a1.5 1.5 0 0 1 1.5 1.5v9A1.5 1.5 0 0 1 19 19.5H5A1.5 1.5 0 0 1 3.5 18z"/></svg></span>
          <span class="row__b"><div class="row__t row__t--mono">playbooks/</div></span>
        </div>
        <div class="row file-row">
          <span class="mk"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M8 13h8M8 17h5"/></svg></span>
          <span class="row__b"><div class="row__t row__t--mono">close-playbook.md</div></span>
          <span class="row__v">24 KB</span>
        </div>
        <div class="row file-row">
          <span class="mk"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M8 13h8M8 17h5"/></svg></span>
          <span class="row__b"><div class="row__t row__t--mono">vendor-terms.pdf</div></span>
          <span class="row__v">1.4 MB</span>
        </div>
        <div class="row file-row" style="border-bottom:0">
          <span class="mk"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="3.5" width="17" height="17" rx="2"/><path d="M3.5 9h17M9 9v11.5"/></svg></span>
          <span class="row__b"><div class="row__t row__t--mono">chart-of-accounts.csv</div></span>
          <span class="row__v">61 KB</span>
        </div>
      </div>
      <div class="sep"></div>
      <div class="lbl" style="margin-bottom:14px">Reusable skills</div>
      <div class="skill-row">
        <div class="skill-card">
          <span class="skill-card__g"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l2.2 5.6L20 10.5l-5.8 2L12 18l-2.2-5.5L4 10.5l5.8-1.9z"/></svg></span>
          <span class="skill-card__name">Month-end close</span>
          <span class="skill-card__meta">used 40×</span>
        </div>
        <div class="skill-card">
          <span class="skill-card__g"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l2.2 5.6L20 10.5l-5.8 2L12 18l-2.2-5.5L4 10.5l5.8-1.9z"/></svg></span>
          <span class="skill-card__name">Reconcile</span>
          <span class="skill-card__meta">used 40×</span>
        </div>
        <div class="skill-card">
          <span class="skill-card__g"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l2.2 5.6L20 10.5l-5.8 2L12 18l-2.2-5.5L4 10.5l5.8-1.9z"/></svg></span>
          <span class="skill-card__name">Draft board pack</span>
          <span class="skill-card__meta">used 40×</span>
        </div>
      </div>
      <div class="btn-card">＋ Import skill into team library</div>
    </div>
  </div>
</div></body></html>
