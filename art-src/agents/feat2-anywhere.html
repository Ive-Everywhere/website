<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="_kit.css"></head><body>
<!-- Three sources, ONE card, one glyph treatment. The agent is a footer band,
     not a fourth floating card — it is a different kind of thing. -->
<div class="stage cv-lav">
  <div class="card">
    <div class="hd hd--band">
      <span class="hd__g"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L4.5 12.5a1 1 0 0 0 .8 1.6H11l-1 7.9 8.5-10.5a1 1 0 0 0-.8-1.6H12z"/></svg></span>
      <span class="hd__t">Start a task from</span>
    </div>
    <div class="list">
      <div class="row"><span class="mk"><img src="live/assets/slack.svg" alt=""></span>
        <span class="row__b"><div class="row__t">Slack</div><div class="row__s row__s--mono">#ops · direct message</div></span></div>
      <div class="row"><span class="mk"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M7 6.5h.01"/></svg></span>
        <span class="row__b"><div class="row__t">The web app</div><div class="row__s row__s--mono">app.eluu.ai</div></span></div>
      <div class="row"><span class="mk"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l-5 6 5 6M15 6l5 6-5 6"/></svg></span>
        <span class="row__b"><div class="row__t">The API</div><div class="row__s row__s--mono">POST /v1/tasks</div></span></div>
    </div>
    <div class="foot"><span class="foot__av"><img src="https://api.dicebear.com/9.x/adventurer/svg?seed=Ledger&backgroundColor=c5f2e0" alt=""></span><span><b>Ledger</b> picked it up — close your laptop</span><span class="foot__live"><i></i>Running</span></div>
  </div>
</div></body></html>
