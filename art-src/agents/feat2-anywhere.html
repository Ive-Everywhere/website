<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;450;480&family=JetBrains+Mono:wght@400;450&display=swap');

:root{
  --ink:#1e1c1e;
  --sub:#55525b;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Inter',sans-serif;}

.stage{
  position:relative;
  width:1224px;height:1224px;
  overflow:hidden;
  /* calm, nearly-flat lavender wash — nothing else on the field */
  background:radial-gradient(70% 60% at 50% 42%, #f2eef7 0%, #efe9f2 100%);
}

.pill{
  position:absolute;
  left:302px; width:620px; height:176px;
  background:#ffffff;
  border-radius:88px;
  box-shadow:0 30px 70px -30px rgba(30,28,30,.22), 0 8px 22px -10px rgba(30,28,30,.08);
  display:flex; align-items:center; justify-content:center;
}
.pill--1{ top:262px; }
.pill--2{ top:524px; }
.pill--3{ top:786px; }

.pill__group{
  display:flex; align-items:center; gap:28px;
}
.glyph{
  width:46px; height:46px;
  display:flex; align-items:center; justify-content:center;
  color:var(--ink); flex-shrink:0;
}
.glyph img{ width:46px; height:46px; display:block; }

.pill__label{
  font-weight:400; font-size:42px; color:var(--ink);
}
</style>
</head>
<body>
<div class="stage">

  <div class="pill pill--1">
    <div class="pill__group">
      <span class="glyph"><img src="live/assets/slack.svg" alt="Slack"></span>
      <span class="pill__label">From Slack</span>
    </div>
  </div>

  <div class="pill pill--2">
    <div class="pill__group">
      <span class="glyph">
        <svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="9"/>
          <path d="M3 12h18"/>
          <path d="M12 3c2.6 2.6 4 5.8 4 9s-1.4 6.4-4 9c-2.6-2.6-4-5.8-4-9s1.4-6.4 4-9z"/>
        </svg>
      </span>
      <span class="pill__label">From the web</span>
    </div>
  </div>

  <div class="pill pill--3">
    <div class="pill__group">
      <span class="glyph">
        <svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M8 7L3 12l5 5"/>
          <path d="M16 7l5 5-5 5"/>
          <path d="M14 4l-4 16"/>
        </svg>
      </span>
      <span class="pill__label">From the API</span>
    </div>
  </div>

</div>
</body>
</html>
