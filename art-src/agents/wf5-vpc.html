<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="_kit.css">
<style>
  /* RULE 7: one maroon accent = the lock glyph only. The boundary line and its
     top-left label stay neutral ink/sub — the dashed boundary itself is the idea,
     not a maroon shape. RULE 1: no card header here; the boundary's own corner
     label plays that role, a bare glyph, never a tile. RULE 2: every chip inside
     carries the same avatar+name treatment, no second mark kind. */
  .vpc-pane { padding: 46px 34px 34px; }
  .boundary {
    position: relative;
    border: 1.5px dashed #c9c6bd;
    border-radius: 22px;
    padding: 34px 26px 26px;
  }
  .boundary__label {
    position: absolute; top: -15px; left: 24px;
    display: inline-flex; align-items: center; gap: 9px;
    background: var(--panel); padding: 0 10px;
  }
  .boundary__label__g { width: 20px; height: 20px; color: var(--ink); flex: none; }
  .boundary__label__g svg { width: 100%; height: 100%; display: block; }
  .boundary__label__t { font-family: var(--mono); font-size: 19px; color: var(--sub); letter-spacing: -.01em; }
  .boundary__lock {
    position: absolute; top: -15px; right: 24px;
    width: 30px; height: 30px; background: var(--panel);
    display: flex; align-items: center; justify-content: center;
  }
  .boundary__lock svg { width: 20px; height: 20px; color: var(--maroon); }
  .agrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  .achip { display: flex; align-items: center; gap: 11px; height: 58px; padding: 0 16px; border-radius: 14px; background: var(--panel); border: 1px solid var(--hair); }
  .achip__av { width: 28px; height: 28px; border-radius: 50%; flex: none; overflow: hidden; }
  .achip__av img { width: 100%; height: 100%; display: block; }
  .achip__n { font-size: 21px; font-weight: 450; color: var(--ink); letter-spacing: -.006em; white-space: nowrap; }
</style>
</head><body>
<div class="stage cv-blue">
  <div class="card">
    <div class="vpc-pane">
      <div class="boundary">
        <span class="boundary__label">
          <span class="boundary__label__g"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M7 18h10.5a3.5 3.5 0 0 0 .6-6.95A5.5 5.5 0 0 0 7.1 8.6 4 4 0 0 0 7 18z"/></svg></span>
          <span class="boundary__label__t">your-account · us-east-1</span>
        </span>
        <span class="boundary__lock"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5.5" y="10.5" width="13" height="9.5" rx="2.2"/><path d="M8.3 10.5V7.8a3.7 3.7 0 0 1 7.4 0v2.7"/></svg></span>
        <div class="agrid">
          <span class="achip"><span class="achip__av"><img src="https://api.dicebear.com/9.x/adventurer/svg?seed=Ledger&amp;backgroundColor=c5f2e0" alt=""></span><span class="achip__n">Ledger</span></span>
          <span class="achip"><span class="achip__av"><img src="https://api.dicebear.com/9.x/adventurer/svg?seed=Sana&amp;backgroundColor=b6e3f4" alt=""></span><span class="achip__n">Sana</span></span>
          <span class="achip"><span class="achip__av"><img src="https://api.dicebear.com/9.x/adventurer/svg?seed=Cass&amp;backgroundColor=ffd5dc" alt=""></span><span class="achip__n">Cass</span></span>
          <span class="achip"><span class="achip__av"><img src="https://api.dicebear.com/9.x/adventurer/svg?seed=Hana&amp;backgroundColor=ffdfbf" alt=""></span><span class="achip__n">Hana</span></span>
          <span class="achip"><span class="achip__av"><img src="https://api.dicebear.com/9.x/adventurer/svg?seed=Sol&amp;backgroundColor=d1e8d4" alt=""></span><span class="achip__n">Sol</span></span>
          <span class="achip"><span class="achip__av"><img src="https://api.dicebear.com/9.x/adventurer/svg?seed=Ivy&amp;backgroundColor=e5d4f0" alt=""></span><span class="achip__n">Ivy</span></span>
        </div>
      </div>
    </div>
    <div class="foot">Data &amp; model calls <b>never leave your account.</b></div>
  </div>
</div>
</body></html>
