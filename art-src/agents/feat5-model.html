<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>feat5-model</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;450;480&family=JetBrains+Mono:wght@400;450&display=swap');

  * { margin:0; padding:0; box-sizing:border-box; }

  .stage {
    position:relative;
    width:1224px;
    height:1224px;
    overflow:hidden;
    background:
      radial-gradient(90% 60% at 50% 0%, rgba(255,255,255,.7), transparent 55%),
      radial-gradient(70% 60% at 50% 42%, #f2eef7 0%, #efe9f2 100%);
    font-family:'Inter', sans-serif;
  }

  .window {
    position:absolute;
    left:214px;
    top:220px;
    width:796px;
    height:1050px;
    background:#fafafa;
    border-radius:28px 28px 0 0;
    overflow:hidden;
    box-shadow: 0 30px 70px -30px rgba(30,28,30,.22), 0 8px 22px -10px rgba(30,28,30,.08);
  }

  .chrome-bar {
    position:relative;
    height:100px;
    background:#f4f3f6;
    display:flex;
    align-items:center;
    padding:0 34px;
  }

  .dots { display:flex; gap:20px; }
  .dot { width:22px; height:22px; border-radius:50%; background:#d3d1d6; }

  .win-title {
    position:absolute;
    left:0; right:0;
    text-align:center;
    font:450 34px/1 'Inter', sans-serif;
    color:#55525b;
  }

  .doc-area { position:relative; width:100%; height:calc(100% - 100px); }

  .sheet {
    position:absolute;
    background:#ffffff;
    border-radius:20px 20px 0 0;
  }
  .sheet3 { left:86px;  top:230px; width:624px; height:900px; }
  .sheet2 { left:66px;  top:246px; width:664px; height:900px; }
  .sheet1 { left:46px;  top:262px; width:704px; height:900px; }

  .doc-lines { padding:46px 48px; }
  .doc-lines div {
    font-family:'JetBrains Mono', monospace;
    font-size:30px;
    line-height:54px;
    white-space:pre;
  }
  .h { font-weight:450; color:#755a68; }
  .b { font-weight:400; color:#55525b; }
</style>
</head>
<body>
  <div class="stage">
    <div class="window">
      <div class="chrome-bar">
        <div class="dots">
          <div class="dot"></div>
          <div class="dot"></div>
          <div class="dot"></div>
        </div>
        <div class="win-title">model.yaml</div>
      </div>
      <div class="doc-area">
        <div class="sheet sheet3"></div>
        <div class="sheet sheet2"></div>
        <div class="sheet sheet1">
          <div class="doc-lines">
            <div class="h">## Model</div>
            <div class="b">provider: anthropic</div>
            <div class="b">model: claude-opus-4-5</div>
            <div class="b">billing: your Claude Code subscription</div>
            <div class="b">&nbsp;</div>
            <div class="h">## Fallback</div>
            <div class="b">provider: openai &middot; your API key</div>
            <div class="b">harness: any &mdash; bring your own</div>
            <div class="b">&nbsp;</div>
            <div class="h">## Rules</div>
            <div class="b">swap models anytime, keep the agent</div>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
