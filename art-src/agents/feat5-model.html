<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="_kit.css">
<style>
  /* Krishna: individual cards (not rows in one card), Claude Opus 5. Each model
     is its own card; the selected Claude card carries the maroon band + accent
     bar + "Your subscription" pill + filled radio = the one maroon moment. */
  .mstack { display:flex; flex-direction:column; align-items:center; gap:22px; width:640px; }
  .mcard {
    position:relative; width:640px; display:flex; align-items:center; gap:20px;
    background:var(--panel); border-radius:18px; padding:24px 26px; overflow:hidden;
    box-shadow: 0 20px 44px -22px rgba(30,28,30,.16), 0 4px 12px -6px rgba(30,28,30,.06);
  }
  .mcard--sel { background:var(--maroon-soft); }
  .mcard--sel::before { content:""; position:absolute; left:0; top:0; bottom:0; width:5px; background:var(--maroon); }
  .mcard__mk { width:30px; height:30px; flex:none; color:var(--ink); }
  .mcard__mk svg { width:100%; height:100%; display:block; }
  .mcard__b { min-width:0; flex:1; }
  .mcard__t { font-size:27px; font-weight:480; letter-spacing:-.01em; color:var(--ink); }
  .mcard__s { font-size:20px; color:var(--soft); margin-top:3px; }
  .mcard__sub { display:inline-flex; align-items:center; flex:none; white-space:nowrap;
    height:34px; padding:0 15px; border-radius:11px; background:var(--maroon); color:#fff;
    font-size:17px; font-weight:530; }
  .rad { width:30px; height:30px; border-radius:50%; flex:none; border:2.5px solid #dedbd6; }
  .rad--on { border-color:var(--maroon); background:var(--maroon); box-shadow: inset 0 0 0 6px #fff; }
</style>
</head><body>
<div class="stage cv-lav">
  <div class="mstack">

    <div class="mcard mcard--sel">
      <span class="mcard__mk"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 2v20M2 12h20M5.05 5.05l13.9 13.9M18.95 5.05L5.05 18.95"/></svg></span>
      <span class="mcard__b"><div class="mcard__t">Claude Opus 5</div><div class="mcard__s">On your Claude subscription</div></span>
      <span class="mcard__sub">Your subscription</span>
      <span class="rad rad--on"></span>
    </div>

    <div class="mcard">
      <span class="mcard__mk"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"><path d="M12 2.5L20.2 7.25V16.75L12 21.5L3.8 16.75V7.25Z"/><path d="M12 7.5L16.5 10V15L12 17.5L7.5 15V10Z"/></svg></span>
      <span class="mcard__b"><div class="mcard__t">Codex</div><div class="mcard__s">On your OpenAI plan</div></span>
      <span class="rad"></span>
    </div>

    <div class="mcard">
      <span class="mcard__mk"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M17 6l3 3M14 9l2 2"/></svg></span>
      <span class="mcard__b"><div class="mcard__t">Any open model</div><div class="mcard__s">Your own API keys</div></span>
      <span class="rad"></span>
    </div>

  </div>
</div></body></html>
