<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="_kit.css">
<style>
  /* structures the kit doesn't cover: one big spend-cap meter + 3 tiny per-agent
     mini-bars below it. RULE 7: the meter fill is the single maroon accent in this
     card — the "cap" marker and the 3 mini-bars stay neutral grey on purpose. */
  .cap-body { padding: 30px 30px 34px; }
  .cap-val { font-family: var(--mono); font-weight: 450; font-size: 60px; letter-spacing: -.015em; line-height: 1.05; }
  .cap-sub { font-size: 21px; color: var(--soft); margin-top: 8px; }

  .meter { position: relative; margin-top: 34px; }
  .meter__track { height: 26px; border-radius: 999px; background: var(--tint); border: 1px solid var(--hair); overflow: hidden; }
  .meter__fill { height: 100%; border-radius: 999px; background: var(--maroon); }
  .meter__cap { position: absolute; right: 0; top: -24px; bottom: -10px; display: flex; flex-direction: column; align-items: center; }
  .meter__cap-lbl { font-family: var(--mono); font-size: 15px; color: var(--soft); letter-spacing: .01em; margin-bottom: 6px; white-space: nowrap; }
  .meter__cap-line { flex: 1; width: 2px; background: var(--soft); border-radius: 1px; }

  .cap-chips { display: flex; gap: 14px; margin-top: 30px; }
  .cap-chip { flex: 1; background: var(--panel); border: 1px solid var(--hair); border-radius: 14px; padding: 15px 17px 16px; }
  .cap-chip__name { font-size: 18px; font-weight: 450; color: var(--ink); letter-spacing: -.006em; }
  .cap-chip__bar { margin-top: 11px; height: 6px; border-radius: 999px; background: var(--hair); overflow: hidden; }
  .cap-chip__fill { height: 100%; border-radius: 999px; background: var(--soft); }
</style>
</head><body>
<!-- RULE 1: header carries a bare gauge glyph, never reused as a row mark.
     RULE 7: one maroon accent total — the meter fill. The cap marker and the
     3 per-agent mini-bars below stay neutral so the fill is the only accent. -->
<div class="stage cv-warm">
  <div class="card">
    <div class="hd hd--band">
      <span class="hd__g"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 16a8 8 0 0 1 16 0"/><path d="M12 16l4-5"/><circle cx="12" cy="16" r="1.3" fill="currentColor" stroke="none"/></svg></span>
      <span class="hd__t">Spend cap</span>
      <span class="hd__r"><span class="pill">this month</span></span>
    </div>
    <div class="cap-body">
      <div class="cap-val">$3,720</div>
      <div class="cap-sub">of $6,000 cap</div>
      <div class="meter">
        <div class="meter__cap"><span class="meter__cap-lbl">cap</span><span class="meter__cap-line"></span></div>
        <div class="meter__track"><div class="meter__fill" style="width:62%"></div></div>
      </div>
      <div class="cap-chips">
        <div class="cap-chip">
          <div class="cap-chip__name">Ledger</div>
          <div class="cap-chip__bar"><div class="cap-chip__fill" style="width:58%"></div></div>
        </div>
        <div class="cap-chip">
          <div class="cap-chip__name">Sana</div>
          <div class="cap-chip__bar"><div class="cap-chip__fill" style="width:41%"></div></div>
        </div>
        <div class="cap-chip">
          <div class="cap-chip__name">Cass</div>
          <div class="cap-chip__bar"><div class="cap-chip__fill" style="width:27%"></div></div>
        </div>
      </div>
    </div>
  </div>
</div></body></html>
