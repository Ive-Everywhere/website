<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="_kit.css"></head><body>

        <span class="row__b"><div class="row__t">Pulled 142 payouts</div><div class="row__s row__s--mono">Stripe · July</div></span>

      <div class="row"><span class="mk"><img src="live/assets/gmail.svg" alt=""></span>
        <span class="row__b"><div class="row__t">Emailed 3 exceptions</div><div class="row__s row__s--mono">awaiting your sign-off</div></span>
        <span class="st st--done"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 12.8l4.6 4.6L19.5 6.6"/></svg></span></div>

        <span class="st st--done"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 12.8l4.6 4.6L19.5 6.6"/></svg></span></div>
    </div>
