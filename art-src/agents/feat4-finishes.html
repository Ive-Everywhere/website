<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_kit.css"><style>
  /* Feature 4 · "You get finished work, not a draft" — Ona migration-checklist
     card: task rows tick off as they land, ending on a delivered file (not
     a draft). The final DELIVERED row is the payoff. */
  .win{width:640px}
  .win .row{padding:30px 30px}
  .row__s{font-family:var(--mono)}
  .row--last{background:#fbfaf8}
</style></head><body><div class="stage cv-sand">
  <div class="card win">
    <div class="hd">
      <span class="hd__t">Reconcile month-end close</span>
      <span class="tag tag--ok sp"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 12.8l4.6 4.6L19.5 6.6"/></svg>Done in 1m 12s</span>
    </div>
    <div>
      <div class="row">
        <span class="tile"><img src="live/assets/stripe.svg" alt=""></span>
        <div style="flex:1"><div class="row__l">Pulled <em>142 payouts</em></div><div class="row__s">Stripe</div></div>
        <span class="tick"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 12.8l4.6 4.6L19.5 6.6"/></svg></span>
      </div>
      <div class="row">
        <span class="tile"><img src="live/assets/googlesheets.svg" alt=""></span>
        <div style="flex:1"><div class="row__l">Matched <em>3,208 ledger rows</em></div><div class="row__s">Google Sheets</div></div>
        <span class="tick"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 12.8l4.6 4.6L19.5 6.6"/></svg></span>
      </div>
      <div class="row">
        <span class="tile"><svg viewBox="0 0 24 24" fill="none" stroke="#755A68" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M12 15l-4-4M12 15l4-4"/><path d="M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></svg></span>
        <div style="flex:1"><div class="row__l">Posted <em>139 entries</em></div><div class="row__s">General ledger</div></div>
        <span class="tick"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 12.8l4.6 4.6L19.5 6.6"/></svg></span>
      </div>
      <div class="row row--last">
        <span class="tile tile--maroon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2h9l5 5v13a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2z"/><path d="M15 2v5h5"/></svg></span>
        <div style="flex:1"><div class="row__l">Board pack</div><div class="row__s">reports/july.md</div></div>
        <span class="tag tag--ok">Delivered</span>
      </div>
    </div>
  </div>
</div></body></html>
