<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="_kit.css"></head><body>
<!-- Ona's env-guardrails pattern: outer chrome, inner white pane, label/value
     pairs, a uniform chip grid, and one mono strip. -->
<div class="stage cv-blue">
  <div class="card card--chrome">
    <div class="hd">
      <span class="hd__g"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="4" width="19" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></svg></span>
      <span><span class="hd__t">Agent computer</span></span>
      <span class="hd__r"><span class="pill"><span class="pill__dot"></span>Running</span></span>
    </div>
    <div class="pane">
      <div class="kv">
        <div><div class="kv__l">Machine</div><div class="kv__v kv__v--mono">8 vCPU · 32 GB</div></div>
        <div><div class="kv__l">Lifetime</div><div class="kv__v kv__v--mono">ephemeral</div></div>
      </div>
      <div class="sep"></div>
      <div class="chips">
        <span class="chip"><span class="chip__ok"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 12.8l4.6 4.6L19.5 6.6"/></svg></span>Browser</span>
        <span class="chip"><span class="chip__ok"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 12.8l4.6 4.6L19.5 6.6"/></svg></span>Terminal</span>
        <span class="chip"><span class="chip__ok"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 12.8l4.6 4.6L19.5 6.6"/></svg></span>Files</span>
        <span class="chip"><span class="chip__ok"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 12.8l4.6 4.6L19.5 6.6"/></svg></span>Test suite</span>
        <span class="chip"><span class="chip__ok"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 12.8l4.6 4.6L19.5 6.6"/></svg></span>Secrets</span>
      </div>
      <div class="sep"></div>
      <div class="strip"><span class="dim">agent ~/acme $</span> npm run build<br><span class="ok">✓</span> <span class="dim">compiled · deployed to preview</span></div>
    </div>
  </div>
</div></body></html>
