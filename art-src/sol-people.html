<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_shared.css"><style>
  .stage{background:
    radial-gradient(85% 70% at 16% 12%, #f7eae8 0%, rgba(247,234,232,0) 62%),
    radial-gradient(90% 80% at 90% 90%, #f1ecf5 0%, rgba(241,236,245,0) 60%),
    linear-gradient(165deg,#f6efed 0%,#f4f1f3 100%);}
  .pill{position:absolute;left:120px;display:flex;align-items:center;gap:15px;background:#fff;
        border-radius:999px;padding:20px 32px;font-size:19px;font-weight:480;
        box-shadow:0 14px 34px -14px rgba(31,30,35,.16),0 3px 10px -3px rgba(31,30,35,.07)}
  .pill .dot{width:22px;height:22px;border-radius:50%;border:2.5px solid #d9d3dc;flex:none}
  .pill .dot--on{border-color:#1f8a5b;background:#e4f4ea}
  .p1{top:120px}.p2{top:230px;left:158px}.p3{top:340px;left:196px}
  .short{position:absolute;right:100px;top:470px;width:520px}
  .srow{display:flex;align-items:center;gap:14px;padding:15px 24px;border-bottom:1px solid #f3f1f5;font-size:17.5px}
  .srow:last-child{border-bottom:0}
  .av{width:40px;height:40px;border-radius:50%;overflow:hidden;flex:none;background:#eee}
  .av img{width:100%;height:100%;display:block}
  .sc{margin-left:auto;font-weight:480;font-variant-numeric:tabular-nums}
  .meta{color:#9a95a0;font-size:15px}
</style></head><body><div class="stage">
  <div class="pill p1"><span class="dot dot--on"></span>Screened 62 résumés overnight</div>
  <div class="pill p2"><span class="dot dot--on"></span>Graded against the scorecard</div>
  <div class="pill p3"><span class="dot"></span>Booking the interviews…</div>
  <div class="card short">
    <div class="hd"><span class="hd__t">AE shortlist</span><span class="tag tag--ok" style="margin-left:auto">5 of 62</span></div>
    <div>
      <div class="srow"><span class="av"><img src="https://randomuser.me/api/portraits/women/44.jpg"></span><span>Maya Patel <div class="meta">6 yrs SaaS AE</div></span><span class="sc">92</span></div>
      <div class="srow"><span class="av"><img src="https://randomuser.me/api/portraits/men/64.jpg"></span><span>Jordan Lee <div class="meta">4 yrs fintech AE</div></span><span class="sc">88</span></div>
      <div class="srow"><span class="av"><img src="https://randomuser.me/api/portraits/women/17.jpg"></span><span>Priya Nair <div class="meta">Interview · Thu 2:00 PM</div></span><span class="sc">86</span></div>
    </div>
  </div>
</div></body></html>
