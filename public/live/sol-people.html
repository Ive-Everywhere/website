<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SOL-PEOPLE — Hiring pipeline: screen, grade, book, shortlist</title>
<link href="tokens.css" rel="stylesheet">
<link href="live-shim.css" rel="stylesheet">
<link href="art.css" rel="stylesheet">
<link href="live.css" rel="stylesheet">
<link href="fonts/remixicon.css" rel="stylesheet">
<link href="embed.css" rel="stylesheet">
<style>
  html,body { margin:0; height:100%; background:var(--bg-soft-200); }
  .a-frame { position:absolute; inset:0; }

  /* ── SOL-PEOPLE · THE HIRING RUN AND ITS SHORTLIST ───────────────────────
     One card, two registers: the agent's pipeline (screen → grade → book) on
     a recessed strip up top, and the human payoff — the ranked shortlist —
     on white below it. The header chip narrates the run in maroon and lands
     on the source's one green tag, "5 of 62". Ticks + that tag are the only
     green; scores stay ink so the eye ranks people, not colours.
     Ported from art-src/sol-people.html (1120×900) at c1's pixel scale.     */
  .a-field { --field: color-mix(in srgb, var(--maroon-100) 42%, var(--bg-white-0)); }

  .card {
    position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
    width:540px;
    background:var(--bg-white-0); border:1px solid var(--stroke-soft-200);
    border-radius:14px; box-shadow:var(--shadow-regular-lg); overflow:hidden;
  }

  .hd { display:flex; align-items:center; gap:9px; padding:12px 16px;
        border-bottom:1px solid var(--stroke-soft-200); }
  .hd-t { font-size:15px; font-weight:500; letter-spacing:-.012em; }

  /* ─ pipeline strip ─ */
  .flow { display:flex; flex-direction:column; gap:8px; padding:11px 16px 13px;
          background:var(--bg-weak-25); border-bottom:1px solid var(--stroke-soft-200); }
  .frow { display:flex; align-items:center; gap:11px;
          opacity:.38; transition:opacity .4s var(--ease-out-app); }
  .frow.is-on { opacity:1; }
  .pic { width:34px; height:34px; border-radius:10px; flex:none;
         background:var(--primary-light); color:var(--primary-base);
         display:grid; place-items:center; font-size:19px; }
  .f-t { font-size:13.5px; font-weight:500; letter-spacing:-.01em; flex:1; min-width:0; }
  .f-st { margin-left:auto; width:22px; height:22px; flex:none; position:relative; }
  .f-st .tick { position:absolute; inset:0; display:grid; place-items:center;
                color:var(--success-base); font-size:18px;
                opacity:0; transform:scale(.4);
                transition:opacity .3s var(--ease-out-app), transform .35s var(--ease-out-app); }
  .frow.is-done .tick { opacity:1; transform:scale(1); }
  .f-st .spin { position:absolute; inset:2px; border-radius:50%;
                border:2.5px solid var(--maroon-200); border-top-color:var(--primary-base);
                opacity:0; transition:opacity .25s var(--ease-out-app);
                animation:sp .9s linear infinite; }
  .frow.is-run .spin { opacity:1; }
  .frow.is-done .spin { opacity:0; animation:none; }
  @keyframes sp { to { transform:rotate(360deg) } }

  /* ─ shortlist ─ */
  .list { padding:2px 0; }
  .srow { display:flex; align-items:center; gap:11px; padding:9px 16px;
          border-top:1px solid var(--stroke-soft-200);
          opacity:.3; transition:opacity .42s var(--ease-out-app); }
  .srow:first-child { border-top:0; }
  .srow.is-on { opacity:1; }
  .av { width:30px; height:30px; border-radius:50%; overflow:hidden; flex:none;
        background:var(--bg-soft-200); }
  .av img { width:100%; height:100%; display:block; object-fit:cover; }
  .s-b { flex:1; min-width:0; }
  .s-n { font-size:13.5px; font-weight:500; letter-spacing:-.01em; }
  .s-m { font-size:11px; color:var(--text-soft-400); letter-spacing:-.005em; margin-top:1px; }
  .s-m .a-chip { margin-top:2px; }
  .sc { margin-left:auto; flex:none; font-size:14px; font-weight:500;
        font-variant-numeric:tabular-nums; letter-spacing:-.01em;
        opacity:0; transform:scale(.6);
        transition:opacity .3s var(--ease-out-app), transform .35s var(--ease-out-app); }
  .srow.is-on .sc { opacity:1; transform:scale(1); }

  .pulse { width:6px; height:6px; border-radius:50%; background:var(--primary-base);
           box-shadow:0 0 0 3px var(--primary-alpha-16); animation:l-pulse 1.1s infinite; }
  @keyframes l-pulse { 50% { opacity:.35 } }
</style>
</head>
<body>
<div class="a-frame"><div class="a-field"><div class="a-stage">

  <div class="card" id="card">

    <div class="hd">
      <span class="hd-t">AE shortlist</span>
      <span style="flex:1"></span>
      <span class="a-chip a-chip--brand" id="chip"><span class="pulse"></span>Screening r&eacute;sum&eacute;s&hellip;</span>
    </div>

    <div class="flow">
      <div class="frow" id="f1">
        <span class="pic"><i class="ri-file-text-line"></i></span>
        <span class="f-t">Screened 62 r&eacute;sum&eacute;s</span>
        <span class="f-st"><span class="spin"></span><i class="ri-check-line tick"></i></span>
      </div>
      <div class="frow" id="f2">
        <span class="pic"><i class="ri-checkbox-line"></i></span>
        <span class="f-t">Graded on the scorecard</span>
        <span class="f-st"><span class="spin"></span><i class="ri-check-line tick"></i></span>
      </div>
      <div class="frow" id="f3">
        <span class="pic"><i class="ri-calendar-line"></i></span>
        <!-- label flips when the row completes: a ticked row can't still say "Booking…" -->
        <span class="f-t" id="f3t">Booking the interviews&hellip;</span>
        <span class="f-st"><span class="spin"></span><i class="ri-check-line tick"></i></span>
      </div>
    </div>

    <div class="list">
      <div class="srow" id="s1">
        <span class="av"><img src="assets/avatar-iris.webp" alt=""></span>
        <span class="s-b"><span class="s-n">Maya Patel</span><div class="s-m">6 yrs SaaS AE</div></span>
        <span class="sc">92</span>
      </div>
      <div class="srow" id="s2">
        <span class="av"><img src="assets/avatar-james.webp" alt=""></span>
        <span class="s-b"><span class="s-n">Jordan Lee</span><div class="s-m">4 yrs fintech AE</div></span>
        <span class="sc">88</span>
      </div>
      <div class="srow" id="s3">
        <span class="av"><img src="assets/avatar-priya.webp" alt=""></span>
        <span class="s-b"><span class="s-n">Priya Nair</span><div class="s-m"><span class="a-chip a-chip--time"><i class="ri-time-line" style="font-size:11px"></i>Interview &middot; Thu 2:00 PM</span></div></span>
        <span class="sc">86</span>
      </div>
    </div>

  </div>

</div></div></div>

<script src="live.js"></script>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var chip = $('chip'), card = $('card');
  var FLOW = ['f1','f2','f3'], SHORT = ['s1','s2','s3'];

  function running(text) {
    chip.className = 'a-chip a-chip--brand';
    chip.innerHTML = '<span class="pulse"></span>' + text;
  }

  function reset() {
    // snap, don't unwind — see .l-noanim in live.css
    card.classList.add('l-noanim');
    requestAnimationFrame(function () {
      requestAnimationFrame(function () { card.classList.remove('l-noanim'); });
    });
    FLOW.concat(SHORT).forEach(function (id) {
      $(id).classList.remove('is-on','is-run','is-done');
    });
    // the run is already screening on frame one
    $('f1').classList.add('is-on','is-run');
    $('f3t').innerHTML = 'Booking the interviews&hellip;';
    running('Screening r&eacute;sum&eacute;s&hellip;');
  }

  function done(id)  { $(id).classList.add('is-on','is-done'); $(id).classList.remove('is-run'); }
  function run(id)   { $(id).classList.add('is-on','is-run'); }
  function land(id)  { return function () { $(id).classList.add('is-on'); }; }

  var seq = Live.Seq([
    // pipeline: each stage resolves and the chip narrates the next one
    [900, function () { done('f1'); run('f2'); running('Grading on the scorecard&hellip;'); }],
    [850, function () { done('f2'); run('f3'); running('Booking the interviews&hellip;'); }],
    // the shortlist lands one candidate at a time, scores popping in
    [800, land('s1')],
    [820, land('s2')],
    [840, land('s3')],           // Priya arrives with her interview slot booked
    [900, function () { done('f3'); $('f3t').innerHTML = 'Interviews booked'; }],
    // the source's one green tag: the finished shortlist
    [650, function () {
      chip.className = 'a-chip a-chip--ok';
      chip.innerHTML = '<i class="ri-check-line" style="font-size:11px"></i>5 of 62';
    }]
  ], { reset: reset, hold: 2600 });

  reset();
  Live.autoplay(seq);
})();
</script>
</body>
</html>
