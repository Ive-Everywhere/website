<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>C1-A — Composer expands into the run, collapses into the result</title>
<link href="tokens.css" rel="stylesheet">
<link href="live-shim.css" rel="stylesheet">
<link href="art.css" rel="stylesheet">
<link href="live.css" rel="stylesheet">
<link href="fonts/remixicon.css" rel="stylesheet">
<link href="embed.css" rel="stylesheet">
<style>
  html,body { margin:0; height:100%; background:var(--bg-soft-200); }
  .a-frame { position:absolute; inset:0; }

  /* ── C1-A · ONE MORPHING OBJECT ──────────────────────────────────────────
     A single card in three states: chat box → run window → delivered result.

     Rev 4 (Krishna): NO SCROLLING. The previous build ran three transitions at
     once — the box height, the inner scroll translate, and each row's own
     height — and they fought each other into visible jitter. With four steps
     the card can simply GROW to fit, which is one transition and reads
     smoothly. Scrolling only earns its place when content genuinely exceeds
     the frame; here it was cost with no benefit.

     Also cut: the status subtitle under the task. It changed text at the end,
     which reflowed the whole card and made the last beat jump. The header chip
     is the only status this needs — a crisp success tag beats a long line.   */
  .a-field { --field: color-mix(in srgb, var(--information-light) 42%, #fff); }

  .morph {
    position:absolute; left:50%; top:50%;
    width:430px; height:96px;
    background:var(--bg-white-0); border:1px solid var(--stroke-soft-200);
    border-radius:14px; box-shadow:var(--shadow-composer); overflow:hidden;
    transform:translate(-50%,-50%);
    transition:width .5s var(--ease-out-app), height .5s var(--ease-out-app),
               box-shadow .5s var(--ease-out-app);
  }
  .morph.is-panel  { width:486px; box-shadow:var(--shadow-regular-lg); }
  .morph.is-notify { width:404px; box-shadow:var(--shadow-regular-lg); }

  .layer { position:absolute; inset:0; opacity:0; transition:opacity .26s var(--ease-out-app); pointer-events:none; }
  .layer.is-on { opacity:1; }

  .lay-composer { display:flex; flex-direction:column; justify-content:center; }

  .lay-run { display:flex; flex-direction:column; }
  .run-head { display:flex; align-items:center; gap:8px; padding:11px 14px;
              border-bottom:1px solid var(--stroke-soft-200); flex:none; }
  .task { display:flex; align-items:center; gap:9px; padding:15px 16px 0; flex:none; }
  .task-t { font-size:13.5px; font-weight:500; letter-spacing:-.012em; line-height:1.35; }
  .steps { padding:13px 16px 15px; }
  .l-tool { padding:10px 12px; border-radius:10px; }

  .lay-notify { display:flex; flex-direction:column; justify-content:center; padding:0 15px; }
  .n-row { display:flex; align-items:center; gap:10px; }

  .pulse { width:6px; height:6px; border-radius:50%; background:var(--information-base);
           box-shadow:0 0 0 3px var(--information-lighter); animation:l-pulse 1.1s infinite; }
  @keyframes l-pulse { 50% { opacity:.35 } }
</style>
</head>
<body>
<div class="a-frame"><div class="a-field"><div class="a-stage">

  <div class="morph" id="box">

    <!-- 1 · just a chat box -->
    <div class="layer lay-composer is-on" id="layComposer">
      <div class="l-composer-text" id="typed"></div>
      <div class="l-composer-bar">
        <span class="l-cbtn"><i class="ri-attachment-2"></i></span>
        <span class="l-send" id="send"><i class="ri-arrow-up-line"></i></span>
      </div>
    </div>

    <!-- 2 · the run it expands into -->
    <div class="layer lay-run" id="layRun">
      <div class="run-head" id="runHead">
        <img class="a-av" src="assets/avatar-iris.webp" alt="">
        <span class="a-who"><span class="a-who-name">Iris</span><span class="a-who-role">Finance</span></span>
        <span style="flex:1"></span>
        <span class="a-chip" id="status"><span class="pulse"></span>Running in your cloud</span>
      </div>

      <div class="task" id="task">
        <i class="ri-play-circle-line" style="font-size:15px;color:var(--primary-base)"></i>
        <div class="task-t">Reconcile June payouts against Salesforce</div>
      </div>

      <div class="steps" id="steps">
        <div class="l-slot" id="s1">
          <div class="l-tool">
            <span class="a-logo"><img src="assets/stripe.svg" alt=""></span>
            <span class="l-tool-cmd">Read June payouts</span>
            <span class="l-tool-meta">412</span><i class="ri-check-line l-tool-ok"></i>
          </div>
        </div>
        <div class="l-slot" id="s2">
          <div class="l-tool">
            <span class="a-logo"><img src="assets/salesforce.svg" alt=""></span>
            <span class="l-tool-cmd">Read closed-won opportunities</span>
            <span class="l-tool-meta">388</span><i class="ri-check-line l-tool-ok"></i>
          </div>
        </div>
        <div class="l-slot" id="s3">
          <div class="l-tool">
            <span class="a-logo"><img src="assets/googlesheets.svg" alt=""></span>
            <span class="l-tool-cmd">Write <span class="a-mono">Revenue FY26</span></span>
            <span class="l-tool-meta">390 rows</span><i class="ri-check-line l-tool-ok"></i>
          </div>
        </div>
        <div class="l-slot" id="s4">
          <div class="l-tool">
            <span class="a-logo"><img src="assets/slack.svg" alt=""></span>
            <span class="l-tool-cmd">Post the exceptions to <span class="a-mono">#finance</span></span>
            <span class="l-tool-meta">24</span><i class="ri-check-line l-tool-ok"></i>
          </div>
        </div>
      </div>
    </div>

    <!-- 3 · what it collapses into -->
    <div class="layer lay-notify" id="layNotify">
      <div class="n-row" id="nRow">
        <span class="a-logo" style="width:26px;height:26px;border-radius:8px"><img src="assets/slack.svg" alt="" style="width:15px;height:15px"></span>
        <div style="min-width:0;flex:1">
          <div class="a-p-title" style="font-size:12.5px;margin:0 0 2px">Posted to <span class="a-mono">#finance</span></div>
          <div class="a-p-sub">June reconciliation &middot; 24 exceptions</div>
        </div>
        <span class="a-chip a-chip--ok"><i class="ri-check-line" style="font-size:11px"></i>Done</span>
      </div>
    </div>

  </div>

</div></div></div>

<script src="live.js"></script>
<script>
(function () {
  var Q = 'Reconcile June payouts against Salesforce';
  var $ = function (id) { return document.getElementById(id); };
  var SLOTS = ['s1','s2','s3','s4'];
  var box = $('box');
  var NOTIFY_PAD = 15;   // symmetric breathing room around the two text lines

  function show(which) {
    ['layComposer','layRun','layNotify'].forEach(function (id) {
      $(id).classList.toggle('is-on', id === which);
    });
  }

  /* Measure the run layer's real height for n visible steps rather than
     hard-coding row constants — the card then fits its content exactly and
     stays correct if a row wraps or a step is added. */
  function runHeight(n) {
    var h = $('runHead').offsetHeight + $('task').offsetHeight + 13 + 15; // steps padding
    for (var i = 0; i < n; i++) {
      h += $(SLOTS[i]).firstElementChild.offsetHeight + (i ? 12 : 0);
    }
    return h;
  }

  function reset() {
    box.className = 'morph';
    box.style.height = '';
    show('layComposer');
    $('typed').innerHTML = '';
    $('status').className = 'a-chip';
    $('status').innerHTML = '<span class="pulse"></span>Running in your cloud';
    SLOTS.forEach(function (id) {
      $(id).classList.remove('is-on');
      $(id).querySelector('.l-tool').classList.remove('is-run','is-done');
    });
  }

  function step(id, i) {
    return function () {
      var slot = $(id), tool = slot.querySelector('.l-tool');
      slot.classList.add('is-on');
      tool.classList.add('is-run');
      box.style.height = runHeight(i + 1) + 'px';   // one transition, no scroll
      Live.soon(function () { tool.classList.add('is-done'); }, 620);
    };
  }

  var seq = Live.Seq([
    [400,  function () { Live.type($('typed'), Q, function () { $('typed').innerHTML += '<span class="l-caret"></span>'; }); }],
    [1750, function () { $('send').classList.add('is-hit'); }],
    [200,  function () {
      $('send').classList.remove('is-hit');
      box.classList.add('is-panel');
      box.style.height = runHeight(0) + 'px';
      show('layRun');
    }],
    [560,  step('s1', 0)],
    [880,  step('s2', 1)],
    [880,  step('s3', 2)],
    [840,  step('s4', 3)],
    // the only success signal: one crisp tag in the header
    [800,  function () {
      $('status').className = 'a-chip a-chip--ok';
      $('status').innerHTML = '<i class="ri-check-line" style="font-size:11px"></i>Done in 2m 14s';
    }],
    [1000, function () {
      box.className = 'morph is-notify';
      box.style.height = ($('nRow').offsetHeight + NOTIFY_PAD * 2) + 'px';
      show('layNotify');
    }]
  ], { reset: reset, hold: 3200 });

  reset();
  Live.autoplay(seq);
})();
</script>
</body>
</html>
