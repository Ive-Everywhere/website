<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Pillar · Context — systems in, one learning out (F02 aggregation)</title>
<link href="tokens.css" rel="stylesheet">
<link href="live-shim.css" rel="stylesheet">
<link href="embed.css" rel="stylesheet">
<link href="mv.css" rel="stylesheet">
<style>
  html,body { margin:0; height:100%; background:#ddd; }
  .a-frame { position:absolute; inset:0; }
  .a-field { position:absolute; inset:0; }
  .a-stage { position:absolute; left:50%; top:50%; width:1600px; height:1067px;
             transform:translate(-50%,-50%) scale(var(--s,1));
             font-family:var(--font); color:var(--ink-strong); font-weight:400;
             letter-spacing:.005em; -webkit-font-smoothing:antialiased; }

  /* ── P3 · CONTEXT — F02, aggregation variant ─────────────────────────────
     Many inputs → the colleague → ONE output. The bright coherent line runs
     Sheets → Ledger → the learning she wrote; the other systems are faded
     breadth. The output is the proof beat: a named file, saved to memory. */
  .in  { position:absolute; left:150px; z-index:2; }
  .in--a { top:311px; } .in--b { top:493px; } .in--c { top:675px; }
  .in .mv-node { width:270px; }
  .in--a, .in--c { opacity:.42; filter:saturate(.92); }
  .in .mv-node__ic { background:#fff; box-shadow:0 1px 2px rgba(28,27,31,.06); }
  .in .mv-node__ic img { width:26px; height:26px; }

  .hero { position:absolute; left:585px; top:399px; z-index:2; }
  .mini { width:430px; background:#fff; border-radius:var(--r-lg); overflow:hidden;
          box-shadow:0 34px 64px -22px rgba(28,27,31,.24), 0 10px 24px -10px rgba(28,27,31,.12); }
  .mini__cover { height:64px; position:relative;
    background:radial-gradient(150% 170% at 82% -25%, #3a2f42 0%, transparent 55%),
               linear-gradient(155deg,#2a2130 0%,#191320 100%); }
  .mini__status { position:absolute; left:20px; top:22px; display:inline-flex; align-items:center; gap:8px;
                  color:#efeaf0; font-size:16px; opacity:.92; }
  .mini__body { display:flex; align-items:center; gap:18px; padding:20px 24px 22px; }
  .mini__avatar { width:76px; height:76px; border-radius:20px; border:4px solid #fff; overflow:hidden;
                  margin-top:-46px; position:relative; z-index:2; background:#fff; flex:none; }
  .mini__avatar img { width:100%; height:100%; display:block; }
  .mini__name { font-size:27px; font-weight:480; color:var(--ink-strong); }
  .mini__role { font-size:18px; color:var(--ink-sub); margin-top:2px; }

  .out { position:absolute; left:1160px; top:493px; z-index:2;
         opacity:0; transform:translateY(10px);
         transition:opacity .55s ease, transform .55s ease; }
  .out.is-on { opacity:1; transform:none; }
  .out .mv-node { width:340px; }
  .out .mv-node__label { font-size:20px; white-space:nowrap; }

  .mv-connectors path.bright { stroke:var(--accent); stroke-opacity:.4; }
  #pout { stroke-opacity:0; transition:stroke-opacity .5s ease; }
  #pout.on { stroke-opacity:.4; }
  #portout { opacity:0; transition:opacity .5s ease; }
  #portout.on { opacity:1; }
  #fname { display:inline-block; transition:opacity .35s ease; }
  #fname.swap { opacity:0; }
  .pulse-dot { position:absolute; left:0; top:0; width:9px; height:9px; border-radius:50%;
               background:var(--accent); opacity:0; z-index:3; }
  .pulse-dot.is-go { animation:p3go .9s ease forwards; }
  @keyframes p3go { 0% { opacity:0; offset-distance:0% } 15% { opacity:1 }
                    85% { opacity:1 } 100% { opacity:0; offset-distance:100% } }
</style>
</head>
<body>
<div class="a-frame"><div class="a-field"><div class="a-stage" data-w="1600" data-h="1067">
  <div class="mv-canvas mv-canvas--cream"></div>

  <svg class="mv-connectors" viewBox="0 0 1600 1067" preserveAspectRatio="none">
    <path class="faint" d="M436,352 C510,352 520,520 585,531"/>
    <path class="faint" d="M436,716 C510,716 520,548 585,537"/>
    <path class="bright" id="pin" d="M436,534 L585,534"/>
    <path class="bright" id="pout" d="M1015,534 L1160,534"/>
    <circle class="mv-node-dot" cx="585" cy="534" r="5"/>
    <circle class="mv-node-dot" id="portout" cx="1015" cy="534" r="5"/>
  </svg>
  <span class="pulse-dot" id="din"  style="offset-path:path('M436,534 L585,534')"></span>
  <span class="pulse-dot" id="dout" style="offset-path:path('M1015,534 L1160,534')"></span>

  <div class="in in--a"><div class="mv-node mv-rest">
    <div class="mv-node__ic"><img src="assets/hubspot.svg" alt="HubSpot"></div>
    <div><div class="mv-node__label">HubSpot</div><div class="mv-node__meta">214 deals</div></div>
  </div></div>
  <div class="in in--b"><div class="mv-node mv-raised">
    <div class="mv-node__ic"><img src="assets/googlesheets.svg" alt="Google Sheets"></div>
    <div><div class="mv-node__label">Google Sheets</div><div class="mv-node__meta">3,208 ledger rows</div></div>
  </div></div>
  <div class="in in--c"><div class="mv-node mv-rest">
    <div class="mv-node__ic"><img src="assets/stripe.svg" alt="Stripe"></div>
    <div><div class="mv-node__label">Stripe</div><div class="mv-node__meta">142 payouts</div></div>
  </div></div>

  <div class="hero"><div class="mini">
    <div class="mini__cover"><div class="mini__status"><span class="mv-cc__dot"></span>Learning</div></div>
    <div class="mini__body">
      <div class="mini__avatar"><img src="https://api.dicebear.com/9.x/adventurer/svg?seed=Ledger&backgroundColor=c5f2e0" alt="Ledger"></div>
      <div><div class="mini__name">Ledger</div><div class="mini__role">Finance Ops</div></div>
    </div>
  </div></div>

  <div class="out" id="out"><div class="mv-node mv-raised">
    <div class="mv-node__ic"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg></div>
    <div><div class="mv-node__label" id="fname">Stripe payout tables.md</div><div class="mv-node__meta">Saved to memory</div></div>
  </div></div>

</div></div></div>
<script src="live.js"></script>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var FILES = ['Stripe payout tables.md', 'AE team roster.txt', 'Refund policy notes.md'];
  var round = 0;

  function go(id) { var d = $(id); d.classList.remove('is-go'); void d.offsetWidth; d.classList.add('is-go'); }

  function reset() {
    round = 0;
    $('out').classList.remove('is-on'); $('fname').classList.remove('swap');
    $('pout').classList.remove('on'); $('portout').classList.remove('on');
    $('fname').textContent = FILES[0];
  }

  function swapFile() {
    $('fname').classList.add('swap');
    Live.soon(function () {
      round++; $('fname').textContent = FILES[round % FILES.length];
      $('fname').classList.remove('swap');
    }, 350);
  }

  var seq = Live.Seq([
    [700,  function () { go('din'); }],
    [1100, function () { $('pout').classList.add('on'); $('portout').classList.add('on'); go('dout'); }],
    [750,  function () { $('out').classList.add('is-on'); }],
    [3300, function () { go('din'); }],
    [1100, function () { go('dout'); }],
    [750,  swapFile],
    [3300, function () { go('din'); }],
    [1100, function () { go('dout'); }],
    [750,  swapFile]
  ], { reset: reset, hold: 3300 });

  reset();
  Live.autoplay(seq);
})();
</script>
</body>
</html>
