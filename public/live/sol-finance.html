<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SOL-FIN — Month-end close: the run resolves row by row, then reports done</title>
<link href="tokens.css" rel="stylesheet">
<link href="live-shim.css" rel="stylesheet">
<link href="art.css" rel="stylesheet">
<link href="live.css" rel="stylesheet">
<link href="fonts/remixicon.css" rel="stylesheet">
<link href="embed.css" rel="stylesheet">
<style>
  html,body { margin:0; height:100%; background:var(--bg-soft-200); }
  .a-frame { position:absolute; inset:0; }

  /* ── SOL-FIN · MONTH-END CLOSE ───────────────────────────────────────────
     One card, one story: the close is RUNNING (maroon pill, rows dimmed),
     the rows resolve one by one — three ticks and one amber exception —
     and then the header pill flips to the single green "Done in 1m 12s".

     Ported from art-src/sol-finance.html (authored at 1120×900, Ona-scale
     type) down to the shared 700×438 stage at c1-a-compose's pixel scale.
     Exactly ONE green treatment: the row ticks and the done pill both draw
     from the success ramp; the exception row gets the warning ramp instead. */
  .a-field { --field: color-mix(in srgb, var(--success-lighter) 46%, var(--bg-white-0)); }

  .close-card {
    position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
    width:540px;
    background:var(--bg-white-0); border:1px solid var(--stroke-soft-200);
    border-radius:14px; box-shadow:var(--shadow-regular-lg); overflow:hidden;
  }

  .hd { display:flex; align-items:center; gap:10px; padding:12px 16px;
        border-bottom:1px solid var(--stroke-soft-200); }
  .hd-t { font-size:15px; font-weight:500; letter-spacing:-.012em; }
  .hd .a-chip { margin-left:auto; }

  .row { display:flex; align-items:center; gap:12px; padding:11px 16px;
         border-top:1px solid var(--stroke-soft-200); }
  .row:first-child { border-top:0; }

  /* pending rows sit dimmed; resolving brightens them and pops the mark in */
  .row-main { display:flex; align-items:center; gap:12px; flex:1; min-width:0;
              opacity:.38; transition:opacity .4s var(--ease-out-app); }
  .row.is-done .row-main { opacity:1; }

  .ic { width:34px; height:34px; border-radius:10px; flex:none;
        display:grid; place-items:center;
        background:var(--bg-white-0); border:1px solid var(--stroke-soft-200);
        box-shadow:var(--shadow-regular-sm); }
  .ic img { width:20px; height:20px; display:block; }
  .ic i { font-size:20px; color:var(--primary-base); }

  .row-t { font-size:13.5px; letter-spacing:-.008em; color:var(--text-strong-950);
           flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .row-t em { font-style:normal; font-weight:500; }

  .mark { width:22px; height:22px; border-radius:50%; flex:none;
          display:grid; place-items:center;
          opacity:0; transform:scale(.4);
          transition:opacity .3s var(--ease-out-app), transform .42s var(--ease-out-app); }
  .row.is-done .mark { opacity:1; transform:scale(1); }
  .mark--ok { background:var(--success-lighter); color:var(--success-base); font-size:14px; }
  .mark--warn { background:color-mix(in srgb, var(--warning-base) 14%, var(--bg-white-0));
                color:var(--warning-base); font-size:13px; font-weight:600; }

  .pulse { width:6px; height:6px; border-radius:50%; background:var(--primary-base);
           box-shadow:0 0 0 3px var(--primary-alpha-16); animation:l-pulse 1.1s infinite; }
  @keyframes l-pulse { 50% { opacity:.35 } }
</style>
</head>
<body>
<div class="a-frame"><div class="a-field"><div class="a-stage">

  <div class="close-card" id="card">
    <div class="hd">
      <span class="hd-t">Month-end close</span>
      <span class="a-chip" id="pill"></span>
    </div>
    <div>
      <div class="row" id="r1">
        <div class="row-main">
          <span class="ic"><img src="assets/stripe.svg" alt=""></span>
          <span class="row-t">Pulled <em>142 payouts</em> from Stripe</span>
        </div>
        <span class="mark mark--ok"><i class="ri-check-line"></i></span>
      </div>
      <div class="row" id="r2">
        <div class="row-main">
          <span class="ic"><img src="assets/googlesheets.svg" alt=""></span>
          <span class="row-t">Matched <em>3,208 ledger rows</em></span>
        </div>
        <span class="mark mark--ok"><i class="ri-check-line"></i></span>
      </div>
      <div class="row" id="r3">
        <div class="row-main">
          <span class="ic"><img src="assets/gmail.svg" alt=""></span>
          <span class="row-t"><em>3 exceptions</em> emailed for sign-off</span>
        </div>
        <span class="mark mark--warn">!</span>
      </div>
      <div class="row" id="r4">
        <div class="row-main">
          <span class="ic"><i class="ri-file-chart-line"></i></span>
          <span class="row-t">Board pack refreshed</span>
        </div>
        <span class="mark mark--ok"><i class="ri-check-line"></i></span>
      </div>
    </div>
  </div>

</div></div></div>

<script src="live.js"></script>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var ROWS = ['r1','r2','r3','r4'];
  var pill = $('pill');
  var card = $('card');

  function reset() {
    // snap, don't unwind — see .l-noanim in live.css
    card.classList.add('l-noanim');
    requestAnimationFrame(function () {
      requestAnimationFrame(function () { card.classList.remove('l-noanim'); });
    });
    ROWS.forEach(function (id) { $(id).classList.remove('is-done'); });
    pill.className = 'a-chip a-chip--brand';
    pill.innerHTML = '<span class="pulse"></span>Closing the month…';
  }

  function done(id) { return function () { $(id).classList.add('is-done'); }; }

  var seq = Live.Seq([
    [900, done('r1')],
    [850, done('r2')],
    [850, done('r3')],
    [800, done('r4')],
    // the only success signal in the header: one crisp green tag
    [700, function () {
      pill.className = 'a-chip a-chip--ok';
      pill.innerHTML = '<i class="ri-check-line" style="font-size:11px"></i>Done in 1m 12s';
    }]
  ], { reset: reset, hold: 2600 });

  reset();
  Live.autoplay(seq);
})();
</script>
</body>
</html>
