<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SOL-CE — An incident worked end to end: alert, cause, PR, rollback, post-mortem</title>
<link href="tokens.css" rel="stylesheet">
<link href="live-shim.css" rel="stylesheet">
<link href="art.css" rel="stylesheet">
<link href="live.css" rel="stylesheet">
<link href="fonts/remixicon.css" rel="stylesheet">
<link href="embed.css" rel="stylesheet">
<style>
  html,body { margin:0; height:100%; background:var(--bg-soft-200); }
  .a-frame { position:absolute; inset:0; }

  /* ── SOL-CE · THE INCIDENT TIMELINE ──────────────────────────────────────
     Port of art-src/sol-ce.html (static, 1120×900) onto the default 700×438
     live stage. One card, one story: checkout-service pages, the agents work
     the incident, and the timeline writes itself — spike, cause, PR, rollback,
     post-mortem. Content is the source's verbatim; only the scale and the
     colour vocabulary change (tokens instead of the art-src hexes).

     Motion: the header chip opens amber — "Triaging alert…" — because an
     incident card's resting state is attention, not calm. Timeline rows then
     land one by one at incident pace (~750-900ms): each slides in and its icon
     chip pops; the action rows (cause, PR, post-mortem) get a small tick a
     beat later. The alert row keeps its attention colouring — it is the one
     line that never turns green. The rollback row carries the source's green
     "resolved", and the chip flips to the matching success tag right after.
     One green treatment throughout: success-base marks, a-chip--ok tag.      */

  .card {
    position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
    width:540px; background:var(--bg-white-0); border:1px solid var(--stroke-soft-200);
    border-radius:14px; box-shadow:var(--shadow-regular-lg); overflow:hidden;
  }
  .hd { display:flex; align-items:center; gap:8px; padding:12px 16px;
        border-bottom:1px solid var(--stroke-soft-200); }
  .hd-t { font-size:15px; font-weight:500; letter-spacing:-.012em; flex:1; min-width:0;
          white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  .rows { padding:7px 16px 13px; }
  .lg { display:flex; align-items:center; gap:11px; padding:7px 0;
        opacity:0; transform:translateY(7px);
        transition:opacity .38s var(--ease-out-app), transform .38s var(--ease-out-app); }
  .lg.is-on { opacity:1; transform:none; }

  .ts { font-family:var(--font-mono); font-size:11px; font-variant-numeric:tabular-nums;
        color:var(--text-soft-400); flex:none; width:42px; }
  .lgic { width:34px; height:34px; border-radius:10px; flex:none;
          background:var(--bg-white-0); border:1px solid var(--stroke-soft-200);
          display:grid; place-items:center;
          transform:scale(.6); transition:transform .42s var(--ease-out-app); }
  .lg.is-on .lgic { transform:scale(1); }
  .lgic img { width:20px; height:20px; display:block; }
  .lgic i { font-size:19px; }

  .lg-x { font-family:var(--font-mono); font-size:13px; letter-spacing:-.01em;
          color:var(--text-strong-950); flex:1; min-width:0;
          white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .lg-x em { font-style:normal; font-weight:500; color:var(--text-strong-950); }
  .bad { color:var(--error-base); font-weight:500; }
  .ok  { color:var(--success-base); font-weight:500; }

  /* tick pop — a beat after an action row lands */
  .lg-tick { color:var(--success-base); font-size:15px; flex:none;
             opacity:0; transform:scale(.5);
             transition:opacity .3s var(--ease-out-app), transform .3s var(--ease-out-app); }
  .lg.is-done .lg-tick { opacity:1; transform:none; }

  .pulse { width:6px; height:6px; border-radius:50%; background:var(--away-base);
           box-shadow:0 0 0 3px var(--away-light); animation:l-pulse 1.1s infinite; }
  @keyframes l-pulse { 50% { opacity:.35 } }
</style>
</head>
<body>
<div class="a-frame"><div class="a-field"><div class="a-stage">

  <div class="card" id="card">
    <div class="hd">
      <div class="hd-t">checkout-service · incident</div>
      <span class="a-chip a-chip--brand">Cass on call</span>
      <span class="a-chip a-chip--time" id="status"><span class="pulse"></span>Triaging alert…</span>
    </div>

    <div class="rows">
      <div class="lg" id="r1">
        <span class="ts">12:18</span>
        <span class="lgic"><i class="ri-alarm-warning-line" style="color:var(--error-base)"></i></span>
        <span class="lg-x"><span class="bad">spike detected</span> · 500s &gt; 5%</span>
      </div>
      <div class="lg" id="r2">
        <span class="ts">12:21</span>
        <span class="lgic"><i class="ri-search-line" style="color:var(--primary-base)"></i></span>
        <span class="lg-x">cause found: <em>divide-by-zero · main.go:236</em></span>
        <i class="ri-check-line lg-tick"></i>
      </div>
      <div class="lg" id="r3">
        <span class="ts">12:24</span>
        <span class="lgic"><img src="assets/github.svg" alt=""></span>
        <span class="lg-x">PR <em>#4471</em> opened · guard + test</span>
        <i class="ri-check-line lg-tick"></i>
      </div>
      <div class="lg" id="r4">
        <span class="ts">12:41</span>
        <span class="lgic"><i class="ri-check-line" style="color:var(--success-base)"></i></span>
        <span class="lg-x">rollback deployed · <span class="ok">resolved</span></span>
      </div>
      <div class="lg" id="r5">
        <span class="ts">12:44</span>
        <span class="lgic"><img src="assets/linear.svg" alt=""></span>
        <span class="lg-x">post-mortem filed · <em>ENG-1043</em></span>
        <i class="ri-check-line lg-tick"></i>
      </div>
    </div>
  </div>

</div></div></div>

<script src="live.js"></script>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var ROWS = ['r1','r2','r3','r4','r5'];

  function reset() {
    // snap, don't unwind — see .l-noanim in live.css
    var card = $('card');
    card.classList.add('l-noanim');
    requestAnimationFrame(function () {
      requestAnimationFrame(function () { card.classList.remove('l-noanim'); });
    });
    ROWS.forEach(function (id) { $(id).classList.remove('is-on', 'is-done'); });
    $('status').className = 'a-chip a-chip--time';
    $('status').innerHTML = '<span class="pulse"></span>Triaging alert…';
  }

  // A row lands: slide in + icon pop; action rows earn their tick a beat later.
  function land(id, tick) {
    return function () {
      var row = $(id);
      row.classList.add('is-on');
      if (tick) Live.soon(function () { row.classList.add('is-done'); }, 380);
    };
  }

  var seq = Live.Seq([
    [500, land('r1', false)],   // spike detected — the attention row, never green
    [900, land('r2', true)],    // cause found
    [850, land('r3', true)],    // PR opened
    [900, land('r4', false)],   // rollback deployed · resolved — the green beat
    [780, land('r5', true)],    // post-mortem filed
    // the payoff: the amber triage chip becomes the one success tag
    [720, function () {
      $('status').className = 'a-chip a-chip--ok';
      $('status').innerHTML = '<i class="ri-check-line" style="font-size:11px"></i>Resolved in 23m';
    }]
  ], { reset: reset, hold: 2600 });

  reset();
  Live.autoplay(seq);
})();
</script>
</body>
</html>
