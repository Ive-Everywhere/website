<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Pillar · Security — the audit trail, flowing</title>
<link href="tokens.css" rel="stylesheet">
<link href="live-shim.css" rel="stylesheet">
<link href="art.css" rel="stylesheet">
<link href="live.css" rel="stylesheet">
<link href="fonts/remixicon.css" rel="stylesheet">
<link href="embed.css" rel="stylesheet">
<style>
  html,body { margin:0; height:100%; background:var(--bg-soft-200); }
  .a-frame { position:absolute; inset:0; }

  /* ── P4 · SECURITY — the audit trail IS the picture ──────────────────────
     One window, one endless upward flow of real log lines: scope checks,
     reads, approvals, actions, every one timestamped. The list is doubled
     and translated 50% for a seamless loop; edges are masked so lines are
     born and die softly. Simple abstraction: nothing happens unlogged.     */
  .a-stage { display:grid; place-items:center; }
  .panel { width:474px; height:312px; background:var(--bg-white-0);
           border:1px solid var(--stroke-soft-200); border-radius:16px;
           box-shadow:var(--shadow-regular-lg); display:flex; flex-direction:column; overflow:hidden; }
  .head { display:flex; align-items:center; gap:8px; padding:13px 17px;
          border-bottom:1px solid var(--stroke-soft-200); flex:none; }
  .head i.lk { color:var(--primary-base); font-size:14px; }
  .head-t { font-size:10.5px; color:var(--text-sub-600); text-transform:uppercase; letter-spacing:.07em; font-weight:600; }
  .head .a-chip { margin-left:auto; }
  .livepip { width:5px; height:5px; border-radius:50%; background:var(--information-base);
             display:inline-block; animation:p4pulse 1.4s infinite; }
  @keyframes p4pulse { 50% { opacity:.35 } }

  .flowbox { flex:1; position:relative; overflow:hidden;
             -webkit-mask:linear-gradient(180deg,transparent 0,#000 12%,#000 88%,transparent 100%);
             mask:linear-gradient(180deg,transparent 0,#000 12%,#000 88%,transparent 100%); }
  .flow { position:absolute; left:0; right:0; top:0; padding:8px 17px;
          animation:p4flow 26s linear infinite; }
  @media (prefers-reduced-motion: reduce) { .flow { animation:none; transform:translateY(-25%); } }
  @keyframes p4flow { to { transform:translateY(-50%); } }
  .log { display:flex; align-items:baseline; gap:10px; padding:5.5px 0;
         font-family:var(--font-mono); font-size:11px; line-height:1.5;
         color:var(--text-sub-600); flex:none; white-space:nowrap; }
  .log .t { color:var(--text-soft-400); flex:none; }
  .log b { color:var(--text-strong-950); font-weight:500; }
  .log .ok { color:var(--success-base); }
  .log .warn { color:var(--warning-dark); }
  .log img { width:13px; height:13px; align-self:center; flex:none; }
</style>
</head>
<body>
<div class="a-frame"><div class="a-field"><div class="a-stage" data-w="600" data-h="400">

  <div class="panel">
    <div class="head">
      <i class="lk ri-lock-2-line"></i><span class="head-t">Audit trail · your environment</span>
      <span class="a-chip a-chip--live"><span class="livepip"></span>Live</span>
    </div>
    <div class="flowbox"><div class="flow" id="flow"></div></div>
  </div>

</div></div></div>
<script src="live.js"></script>
<script>
(function () {
  // One believable working hour. Doubled below for the seamless 50% loop.
  var L = [
    ['09:41:02','stripe',       '<b>scope</b> checked — payouts:read only'],
    ['09:41:04','stripe',       'read <b>142 payouts</b> · July'],
    ['09:41:09','googlesheets', 'matched <b>139 rows</b> against ledger'],
    ['09:41:12',null,           '<b>memory</b> updated · july-close.md'],
    ['09:41:30','gmail',        'sent <b>3 exceptions</b> for sign-off <span class="ok">✓ logged</span>'],
    ['09:52:18','hubspot',      '<span class="warn">approval requested</span> — archive 30 deals'],
    ['09:53:41',null,           '<b>approved</b> by David · recorded'],
    ['09:53:42','hubspot',      '<b>30 deals</b> archived <span class="ok">✓ logged</span>'],
    ['10:04:07','linear',       'created <b>FIN-208</b> · missing invoice'],
    ['10:04:11',null,           '<b>session</b> ended · tokens metered'],
    ['10:15:55','slack',        'posted summary to <b>#month-end-close</b>'],
    ['10:16:02',null,           '<b>scope</b> denied — crm.contacts:write <span class="warn">not granted</span>'],
    ['10:16:03','zendesk',      'read <b>8 tickets</b> · Vertex escalation'],
    ['10:16:20',null,           '<b>audit</b> snapshot exported · SOC 2'],
  ];
  var row = function (l) {
    return '<div class="log"><span class="t">' + l[0] + '</span>' +
      (l[1] ? '<img src="assets/' + l[1] + '.svg" alt="">' : '') +
      '<span>' + l[2] + '</span></div>';
  };
  // doubled: the keyframe travels exactly one copy's height (50%)
  document.getElementById('flow').innerHTML = L.map(row).join('') + L.map(row).join('');
})();
</script>
</body>
</html>
