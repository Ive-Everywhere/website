<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Pillar · Apps — a hosted app assembles and goes live (Mercury paper)</title>
<link href="tokens.css" rel="stylesheet">
<link href="live-shim.css" rel="stylesheet">
<link href="embed.css" rel="stylesheet">
<link href="mv.css" rel="stylesheet">
<style>
  html,body { margin:0; height:100%; background:#ddd; }
  .a-frame { position:absolute; inset:0; }
  .a-field { position:absolute; inset:0; }
  .a-stage { position:absolute; left:50%; top:50%; width:1600px; height:1067px;
             transform:translate(-50%,-50%) scale(var(--s,1));
             font-family:var(--font); color:var(--ink-strong); font-weight:400;
             letter-spacing:.005em; -webkit-font-smoothing:antialiased; }

  /* ── P2 · APPS — one browser object on lavender paper ────────────────────
     The mv-browser frame floats with the toolkit's shadow; the URL pill is
     the claim (hosted software), the Live pill is the payoff. Tiles pop,
     the chart draws itself. Weight ceiling 480, tabular figures.           */
  .hero { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); z-index:2; }
  .mv-browser { width:860px; }
  .mv-browser__bar { height:64px; padding:0 22px; gap:10px; }
  .mv-browser__dot { width:13px; height:13px; }
  .url { flex:1; display:flex; align-items:center; justify-content:center; gap:9px;
         height:38px; margin:0 18px; border-radius:12px; background:#f3f1f4;
         font-size:19px; color:var(--ink-sub); letter-spacing:.005em; }
  .url svg { width:15px; height:15px; color:var(--ink-soft); }
  .url em { font-style:normal; font-weight:480; color:var(--accent); }
  .bar-pill { opacity:0; transition:opacity .5s ease; }
  .bar-pill.is-on { opacity:1; }
  .pip { width:9px; height:9px; border-radius:50%; background:#2eb67d; }

  .body { padding:26px 28px 24px; }
  .kgrid { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  .kpi { border:1px solid var(--hair); border-radius:var(--r-md); padding:18px 22px;
         opacity:0; transform:scale(.95); transform-origin:center;
         transition:opacity .5s ease, transform .5s ease; }
  .kpi.is-on { opacity:1; transform:none; }
  .kpi__l { font-size:16px; color:var(--ink-soft); letter-spacing:.01em; }
  .kpi__v { font-size:37px; font-weight:480; color:var(--ink-strong); margin-top:4px;
            font-variant-numeric:tabular-nums; letter-spacing:.005em; }
  .chartbox { margin-top:16px; border:1px solid var(--hair); border-radius:var(--r-md);
              padding:18px 22px 12px; opacity:0; transition:opacity .5s ease; }
  .chartbox.is-on { opacity:1; }
  .chartbox__l { font-size:16px; color:var(--ink-soft); letter-spacing:.01em; margin-bottom:10px; }
  .chartbox svg { display:block; width:100%; height:150px; }
  .cl { stroke-dasharray:860; stroke-dashoffset:860; }
  .cf { opacity:0; transition:opacity .6s ease .45s; }
  .chartbox.is-drawn .cl { transition:stroke-dashoffset 1.2s ease; stroke-dashoffset:0; }
  .chartbox.is-drawn .cf { opacity:1; }
  .foot { display:flex; align-items:center; gap:9px; padding:0 28px 22px;
          font-size:17px; color:var(--ink-soft); opacity:0; transition:opacity .5s ease; }
  .foot.is-on { opacity:1; }
  .foot em { font-style:normal; font-weight:480; color:var(--ink-sub); }
</style>
</head>
<body>
<div class="a-frame"><div class="a-field"><div class="a-stage" data-w="1600" data-h="1067">
  <div class="mv-canvas mv-canvas--lav"></div>

  <div class="hero">
    <div class="mv-browser mv-floating">
      <div class="mv-browser__bar">
        <span class="mv-browser__dot"></span><span class="mv-browser__dot"></span><span class="mv-browser__dot"></span>
        <span class="url">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="5" y="10" width="14" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
          <span><em>acme-finance</em>.eluu.site</span>
        </span>
        <span class="mv-pill mv-pill--live bar-pill" id="livepill"><span class="pip"></span>Live</span>
      </div>
      <div class="body">
        <div class="kgrid">
          <div class="kpi" id="k1"><div class="kpi__l">Cash</div><div class="kpi__v">$2.1M</div></div>
          <div class="kpi" id="k2"><div class="kpi__l">Runway</div><div class="kpi__v">18 mo</div></div>
        </div>
        <div class="chartbox" id="chart">
          <div class="chartbox__l">Net revenue · FY26</div>
          <svg viewBox="0 0 800 160" preserveAspectRatio="none">
            <path class="cf" d="M0,132 L114,120 L228,108 L342,86 L456,76 L570,54 L684,36 L800,18 L800,160 L0,160 Z" fill="#755a68" fill-opacity=".09"/>
            <path class="cl" d="M0,132 L114,120 L228,108 L342,86 L456,76 L570,54 L684,36 L800,18" fill="none" stroke="#755a68" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
      </div>
      <div class="foot" id="foot">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none"><rect x="5" y="4" width="5" height="16" rx="2.2" fill="#755a68"/><rect x="14" y="4" width="5" height="16" rx="2.2" fill="#755a68"/></svg>
        <span>Built by <em>Ledger</em> · refreshed daily at 7:02 AM</span>
      </div>
    </div>
  </div>

</div></div></div>
<script src="live.js"></script>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  function reset() {
    ['k1','k2'].forEach(function (id) { $(id).classList.remove('is-on'); });
    $('chart').className = 'chartbox';
    $('foot').classList.remove('is-on');
    $('livepill').classList.remove('is-on');
  }
  var seq = Live.Seq([
    [700,  function () { $('k1').classList.add('is-on'); }],
    [320,  function () { $('k2').classList.add('is-on'); }],
    [480,  function () { $('chart').classList.add('is-on'); Live.soon(function () { $('chart').classList.add('is-drawn'); }, 120); }],
    [1600, function () { $('livepill').classList.add('is-on'); }],
    [500,  function () { $('foot').classList.add('is-on'); }]
  ], { reset: reset, hold: 3800 });
  reset();
  Live.autoplay(seq);
})();
</script>
</body>
</html>
