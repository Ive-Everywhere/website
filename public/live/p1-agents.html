<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Pillar · Agents — one team line, a reel of specialists</title>
<link href="tokens.css" rel="stylesheet">
<link href="live-shim.css" rel="stylesheet">
<link href="art.css" rel="stylesheet">
<link href="live.css" rel="stylesheet">
<link href="fonts/remixicon.css" rel="stylesheet">
<link href="embed.css" rel="stylesheet">
<style>
  html,body { margin:0; height:100%; background:var(--bg-soft-200); }
  .a-frame { position:absolute; inset:0; }

  /* ── P1 · AGENTS — Modal's variant-reel, ours: the agent is the variant ──
     One mono line: team.add( <agent> ). The agent card is a vertical reel —
     prev and next ghosted above and below, the active one bright — rolling
     through the four specialists, each with its own integrations. Below the
     divider, "Available in" chips cycle Slack → Chat → API → Phone.        */
  .a-stage { display:grid; place-items:center; }
  .panel { width:480px; background:var(--bg-white-0); border:1px solid var(--stroke-soft-200);
           border-radius:16px; box-shadow:var(--shadow-regular-lg); padding:20px 24px 18px; }
  .p-dots { display:flex; gap:5px; margin-bottom:16px; }
  .p-dots i { width:9px; height:9px; border-radius:50%; background:var(--bg-soft-200); }
  .p-dots i:first-child { background:var(--primary-base); opacity:.55; }

  .line { display:flex; align-items:center; gap:14px; }
  .ln { font-family:var(--font-mono); font-size:13px; color:var(--text-soft-400); flex:none; }
  .code { font-family:var(--font-mono); font-size:15px; color:var(--text-strong-950); flex:none; letter-spacing:-.01em; }
  .code i { font-style:normal; color:var(--text-soft-400); }

  /* the reel — three rows visible, active centered, edges masked */
  .reelbox { position:relative; height:156px; flex:1; overflow:hidden;
             -webkit-mask:linear-gradient(180deg,transparent 0,#000 26%,#000 74%,transparent 100%);
             mask:linear-gradient(180deg,transparent 0,#000 26%,#000 74%,transparent 100%); }
  .reel { position:absolute; left:0; right:0; top:50%;
          transition:transform .55s var(--ease-out-app); }
  .reel.l-noanim { transition:none; }
  .acard { height:52px; display:flex; align-items:center; gap:10px; padding:0 12px;
           border-radius:12px; border:1px solid transparent; opacity:.32; transform:scale(.94);
           transition:opacity .45s, transform .45s var(--ease-out-app), border-color .45s, background .45s;
           background:transparent; }
  .acard.is-active { opacity:1; transform:none; background:var(--bg-weak-50);
                     border-color:var(--stroke-soft-200); }
  .acard + .acard { margin-top:8px; }
  .acard img.av { width:28px; height:28px; border-radius:50%; flex:none; }
  .a-nm { font-size:13px; font-weight:600; letter-spacing:-.01em; white-space:nowrap; }
  .a-tm { font-size:11px; color:var(--text-soft-400); white-space:nowrap; }
  .a-ints { margin-left:auto; display:flex; gap:5px; }
  .a-ints img { width:15px; height:15px; }

  .rule { border-top:1px solid var(--stroke-soft-200); margin:16px 0 13px; }
  .foot { display:flex; align-items:flex-start; gap:34px; }
  .f-l { font-family:var(--font-mono); font-size:11px; color:var(--text-sub-600); margin-bottom:7px; }
  .chips { display:flex; gap:6px; }
  .chip { display:inline-flex; align-items:center; gap:5px; height:24px; padding:0 9px;
          border-radius:7px; background:var(--bg-weak-50); border:1px solid transparent;
          font-family:var(--font-mono); font-size:11px; color:var(--text-soft-400);
          transition:color .3s, background .3s, border-color .3s; }
  .chip i { font-size:12px; }
  .chip.on { color:var(--primary-base); background:color-mix(in srgb, var(--primary-base) 8%, transparent);
             border-color:color-mix(in srgb, var(--primary-base) 25%, transparent); }
  .always { display:inline-flex; align-items:center; gap:6px; height:24px; padding:0 9px;
            border-radius:7px; background:var(--success-lighter); color:var(--success-dark);
            font-family:var(--font-mono); font-size:11px; }
  .always i { width:5px; height:5px; border-radius:50%; background:var(--success-base); }
</style>
</head>
<body>
<div class="a-frame"><div class="a-field"><div class="a-stage" data-w="600" data-h="400">

  <div class="panel">
    <div class="p-dots"><i></i><i></i><i></i></div>

    <div class="line">
      <span class="ln">01</span>
      <span class="code">team.add(</span>
      <div class="reelbox"><div class="reel" id="reel"></div></div>
      <span class="code">)</span>
    </div>

    <div class="rule"></div>
    <div class="foot">
      <div>
        <div class="f-l">Available in</div>
        <div class="chips" id="chans">
          <span class="chip on"><i class="ri-slack-line"></i>Slack</span>
          <span class="chip"><i class="ri-chat-1-line"></i>Chat</span>
          <span class="chip"><i class="ri-braces-line"></i>API</span>
          <span class="chip"><i class="ri-smartphone-line"></i>Phone</span>
        </div>
      </div>
      <div>
        <div class="f-l">Uptime</div>
        <span class="always"><i></i>24/7</span>
      </div>
    </div>
  </div>

</div></div></div>
<script src="live.js"></script>
<script>
(function () {
  var AV = function (seed, bg) { return 'https://api.dicebear.com/9.x/adventurer/svg?seed=' + seed + '&backgroundColor=' + bg; };
  var AGENTS = [
    { n:'Ledger', t:'Finance Ops',    seed:'Ledger', bg:'c5f2e0', ints:['stripe','googlesheets','gmail'] },
    { n:'Sana',   t:'Sales',          seed:'Sana',   bg:'b6e3f4', ints:['hubspot','gmail','slack'] },
    { n:'Cass',   t:'Engineering',    seed:'Cass',   bg:'ffd5dc', ints:['github','linear','zendesk'] },
    { n:'Hana',   t:'People Ops',     seed:'Hana',   bg:'ffdfbf', ints:['notion','gmail','linear'] },
  ];
  var CARD = 60; // card height + gap
  var reel = document.getElementById('reel');
  var chips = document.querySelectorAll('#chans .chip');

  // the reel is the agent list twice, so the wrap-around never shows a gap
  var doubled = AGENTS.concat(AGENTS);
  reel.innerHTML = doubled.map(function (a) {
    return '<div class="acard"><img class="av" src="' + AV(a.seed, a.bg) + '" alt="">' +
      '<span><span class="a-nm">' + a.n + '</span> <span class="a-tm">· ' + a.t + '</span></span>' +
      '<span class="a-ints">' + a.ints.map(function (i) { return '<img src="assets/' + i + '.svg" alt="' + i + '">'; }).join('') + '</span></div>';
  }).join('');
  var cards = reel.children;

  var pos = 0;
  function paint(instant) {
    if (instant) reel.classList.add('l-noanim');
    reel.style.transform = 'translateY(' + (-(pos * CARD) - CARD / 2) + 'px)';
    for (var i = 0; i < cards.length; i++) cards[i].classList.toggle('is-active', i === pos);
    for (var c = 0; c < chips.length; c++) chips[c].classList.toggle('on', c === pos % chips.length);
    if (instant) { void reel.offsetWidth; reel.classList.remove('l-noanim'); }
  }

  function reset() { pos = 0; paint(true); }

  var seq = Live.Seq([
    [1600, function () { pos = 1; paint(); }],
    [1600, function () { pos = 2; paint(); }],
    [1600, function () { pos = 3; paint(); }],
    // one more beat onto the doubled copy, then the reset jump is invisible
    [1600, function () { pos = 4; paint(); }]
  ], { reset: reset, hold: 10 });

  reset();
  Live.autoplay(seq);
})();
</script>
</body>
</html>
